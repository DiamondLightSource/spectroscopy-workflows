apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: panda-repetitions
  labels:
    workflows.diamond.ac.uk/science-group-spectroscopy: "true"
  annotations:
    workflows.argoproj.io/title: "Panda Repetitions Routine"
    workflows.argoproj.io/description: |
      "An example notebook to run some basic analysis on 
      panda data in /p51."
    workflows.diamond.ac.uk/repository: |
        "https://github.com/DiamondLightSource/spectroscopy-workflows"
    workflows.diamond.ac.uk/parameter-schema: |
      {{- .Files.Get "schema/panda-repetitions.json" | nindent 6 }}
    workflows.diamond.ac.uk/ui-schema: |
      {{- .Files.Get "schema/panda-repetitions_ui.json" | nindent 6 }}

spec:
  entrypoint: start
  arguments:
    parameters:
      - name: visitdir
        valueFrom:
          configMapKeyRef:
            name: sessionspaces
            key: data_directory
      - name: xname
      - name: yname
      - name: tiled_id
      - name: fpath

  volumes:
  - name: session
    hostPath:
      path: "{{`{{ workflow.parameters.visitdir }}`}}"
      type: Directory
  - name: data
    hostPath:
      path: "{{`{{ workflow.parameters.fpath }}`}}"
      type: File

  volumeClaimTemplates:
  - metadata:
      name: tmp
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
      storageClassName: netapp
    
  templates:
    - name: panda-repetitions
      script:
        image: ghcr.io/diamondlightsource/spectroscopy-workflows:latest
        
        command: [bash]
        source: |
            echo '{{ .Files.Get "notebooks/panda-repetitions.ipynb" | b64enc }}' | base64 -d > /tmp/notebook.ipynb

            python -m papermill /tmp/notebook.ipynb /tmp/notebook.ipynb \
            -p xname "{{ `workflow.parameters.xname` }}" \
            -p yname "{{ `workflow.parameters.yname` }}" \
            -p tiled_id "{{ `workflow.parameters.tiled_id` }}"
            python -m nbconvert --to html --output notebook --output-dir /tmp /tmp/notebook.ipynb
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: session
          mountPath: "{{`{{ workflow.parameters.visitdir }}`}}"
        - name: data
          mountPath: /data/data.h5

      outputs:
        artifacts:
          - name: notebook
            path: /tmp/notebook.html
            archive:
              none: {}
          - name: plot
            path: /tmp/plot_result.png
            archive:
              none: {}
          - name: report
            path: /tmp/report.json
            archive:
              none: {}
          
    - name: start
      dag:
        tasks:
          - name: panda-repetitions
            template: panda-repetitions